services:
  - type: web
    name: ajb-imports
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ajbimports.com
      - key: ADMIN_PASSWORD_HASH
        value: ""
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: your-email@gmail.com
      - key: SMTP_PASS
        value: your-gmail-app-password
      - key: GOOGLE_SHEET_ID
        value: YOUR_GOOGLE_SHEET_ID
      - key: GOOGLE_SHEET_TAB
        value: Quote Submissions
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        value: '{"type":"service_account","project_id":"","private_key_id":"","private_key":"","client_email":"","client_id":"","auth_uri":"","token_uri":"","auth_provider_x509_cert_url":"","client_x509_cert_url":""}'
    disk:
      name: quote-submissions
      mountPath: /var/data
      sizeGB: 1
