<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AJB Imports | Reset Password</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a2d,
                    #0d3552
                );
        }

        .card {

            width: 100%;

            max-width: 470px;

            background: #edf5ff;

            border: 1px solid rgba(10, 54, 92, 0.12);

            padding: 40px;

            border-radius: 24px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.25);
        }

        .logo {

            text-align: center;

            margin-bottom: 25px;
        }

        .logo img {
            width: 175px;
        }

        .icon {

            width: 70px;

            height: 70px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background: #fff4cc;

            color: #d99d00;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;
        }

        h1 {

            text-align: center;

            color: #071a2d;
        }

        .description {

            text-align: center;

            color: #777;

            margin-bottom: 28px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-wrapper > i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #777;
        }

        input {

            width: 100%;

            padding:
                14px
                45px;

            border:
                1px solid #ddd;

            border-radius: 11px;

            outline: none;
        }

        input:focus {

            border-color: #f4b400;
        }

        .toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;
        }

        .strength {

            height: 5px;

            background: #eee;

            margin-top: 8px;

            border-radius: 10px;
        }

        .strength-bar {

            width: 0;

            height: 100%;

            transition: .3s;
        }

        .requirements {

            font-size: 13px;

            color: #777;

            line-height: 1.7;

            margin-top: 8px;
        }

        .valid {
            color: #188038;
        }

        .invalid {
            color: #b42318;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background: #f4b400;

            font-weight: 700;

            font-size: 15px;

            cursor: pointer;
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            display: none;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .message.success {

            background: #e9f8ef;

            color: #137333;
        }

        .message.error {

            background: #ffe9e9;

            color: #b42318;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">

        <img
            src="ajb-logo.png"
            alt="AJB Imports"
        >

    </div>


    <div class="icon">

        <i class="fa-solid fa-lock"></i>

    </div>


    <h1>
        Create New Password
    </h1>


    <p class="description">

        Choose a strong new password for your
        AJB Imports administrator account.

    </p>


    <div
        id="authMessage"
        class="message"
    ></div>


    <form id="resetPasswordForm">

        <div class="form-group">

            <label>
                New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    required
                >

                <span
                    class="toggle"
                    id="togglePassword"
                >

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>


            <div class="strength">

                <div
                    id="strengthBar"
                    class="strength-bar"
                ></div>

            </div>


            <div class="requirements">

                <span id="length">
                    ✕ At least 8 characters
                </span>

                <span id="uppercase">
                    ✕ One uppercase letter
                </span>

                <span id="number">
                    ✕ One number
                </span>

                <span id="special">
                    ✕ One special character
                </span>

            </div>

        </div>


        <div class="form-group">

            <label>
                Confirm New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            id="resetButton"
        >

            <i class="fa-solid fa-shield-halved"></i>

            Reset Password

        </button>

    </form>

</div>


<script src="/admin-auth.js"></script>

</body>

</html>
