<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AJB Imports | Forgot Password</title>

     <link
        rel="stylesheet"
        href="admin.css"

    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body class="login-page">

    <div class="login-background"></div>

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <div class="logo-symbol">
                    AJB
                </div>

                <div>
                    <strong>
                        AJB IMPORTS
                    </strong>

                    <span>
                        GHANA
                    </span>
                </div>

            </div>

            <div class="login-heading">

                <span>
                    ACCOUNT RECOVERY
                </span>

                <h1>
                    Forgot Password?
                </h1>

                <p>
                    Enter your administrator email address and we’ll send you a secure reset link.
                </p>

            </div>

            <div
                id="authMessage"
                class="login-message"
            ></div>

            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@ajbimports.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="forgotButton"
                >

                    <i class="fa-solid fa-paper-plane"></i>
                    <span>
                        Send Reset Link
                    </span>

                </button>

            </form>

            <div class="auth-links">

                <a href="/admin-login.html">
                    ← Back to Admin Login
                </a>

            </div>

            <div class="login-footer">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Secure AJB Imports Administration
                </span>

            </div>

        </div>

    </main>

    <script src="admin-auth.js"></script>
    <script src="admin.js"></script>

</body>

</html>
