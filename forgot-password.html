<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AJB Imports | Forgot Password</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a2d,
                    #0d3552
                );
        }

        .card {

            width: 100%;

            max-width: 450px;

            background: #edf5ff;

            border: 1px solid rgba(10, 54, 92, 0.12);

            padding: 40px;

            border-radius: 24px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.25);
        }

        .logo {

            text-align: center;

            margin-bottom: 25px;
        }

        .logo img {

            width: 175px;

            max-width: 100%;
        }

        .icon {

            width: 70px;

            height: 70px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff4cc;

            color: #d99d00;

            font-size: 28px;
        }

        h1 {

            text-align: center;

            color: #071a2d;

            margin-bottom: 10px;
        }

        .description {

            text-align: center;

            color: #777;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {

            position: relative;

            margin-bottom: 18px;
        }

        .input-wrapper i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #777;
        }

        input {

            width: 100%;

            padding:
                14px
                14px
                14px
                45px;

            border:
                1px solid #ddd;

            border-radius: 11px;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #f4b400;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background: #f4b400;

            font-weight: 700;

            cursor: pointer;

            font-size: 15px;
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            display: none;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .message.success {

            background: #e9f8ef;

            color: #137333;
        }

        .message.error {

            background: #ffe9e9;

            color: #b42318;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #d99d00;

            font-weight: 600;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">

        <img
            src="ajb-logo.png"
            alt="AJB Imports"
        >

    </div>


    <div class="icon">

        <i class="fa-solid fa-key"></i>

    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="description">

        Enter your administrator email address.
        We'll send you a secure password reset link.

    </p>


    <div
        id="authMessage"
        class="message"
    ></div>


    <form id="forgotPasswordForm">

        <label>
            Email Address
        </label>


        <div class="input-wrapper">

            <i class="fa-solid fa-envelope"></i>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@example.com"
                required
            >

        </div>


        <button
            type="submit"
            id="forgotButton"
        >

            <i class="fa-solid fa-paper-plane"></i>

            Send Reset Link

        </button>

    </form>


    <a
        href="/admin-login.html"
        class="back"
    >

        ← Back to Admin Login

    </a>

</div>


<script src="/admin-auth.js"></script>

</body>

</html>
