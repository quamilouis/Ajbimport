<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AJB Imports | Admin Registration</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a2d,
                    #0d3552
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }

        .auth-wrapper {

            width: 100%;

            max-width: 500px;
        }

        .auth-card {

            background: #edf5ff;

            border: 1px solid rgba(10, 54, 92, 0.12);

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 170px;
        }

        h1 {

            text-align: center;

            color: #071a2d;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 28px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-wrapper > i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #777;
        }

        input {

            width: 100%;

            padding:
                14px
                45px;

            border:
                1px solid #ddd;

            border-radius: 11px;

            outline: none;
        }

        input:focus {

            border-color: #f4b400;
        }

        .toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;
        }

        .strength {

            height: 5px;

            background: #eee;

            border-radius: 10px;

            margin-top: 8px;

            overflow: hidden;
        }

        .strength-bar {

            height: 100%;

            width: 0;

            transition: .3s;
        }

        .requirements {

            font-size: 13px;

            color: #777;

            margin-top: 8px;

            line-height: 1.7;
        }

        .requirements span {
            display: block;
        }

        .valid {
            color: #188038;
        }

        .invalid {
            color: #b42318;
        }

        .register-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background: #f4b400;

            color: #111;

            font-weight: 700;

            font-size: 16px;

            cursor: pointer;
        }

        .register-btn:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            display: none;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .message.error {

            background: #ffe9e9;

            color: #b42318;
        }

        .message.success {

            background: #e9f8ef;

            color: #137333;
        }

        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #777;
        }

        .login-link a {

            color: #d99d00;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="auth-wrapper">

<div class="auth-card">

    <div class="logo">

        <img
            src="ajb-logo.png"
            alt="AJB Imports"
        >

    </div>


    <h1>Create Admin Account</h1>

    <p class="subtitle">
        Register an administrator for AJB Imports.
    </p>


    <div
        id="authMessage"
        class="message"
    ></div>


    <form id="registerForm">


        <div class="form-group">

            <label>
                Full Name
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Administrator name"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Email Address
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@example.com"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                >

                <span
                    class="toggle"
                    id="togglePassword"
                >
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>


            <div class="strength">

                <div
                    id="strengthBar"
                    class="strength-bar"
                ></div>

            </div>


            <div
                id="passwordRequirements"
                class="requirements"
            >

                <span id="length">
                    ✕ At least 8 characters
                </span>

                <span id="uppercase">
                    ✕ One uppercase letter
                </span>

                <span id="number">
                    ✕ One number
                </span>

                <span id="special">
                    ✕ One special character
                </span>

            </div>

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="register-btn"
            id="registerButton"
        >

            <i class="fa-solid fa-user-plus"></i>

            Create Administrator

        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="admin-login.html">
            Sign In
        </a>

    </div>

</div>

</div>


<script src="/admin-auth.js"></script>

</body>

</html>
